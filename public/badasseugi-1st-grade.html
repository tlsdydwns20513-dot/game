<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한글 받아쓰기 모험 - 초등 1학년 (단일 HTML 게임)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Jua&display=swap');

    :root {
      --bg: #F3F7FC;
      --surface: #FFFFFF;
      --border: #DCE6F2;
      --ink: #0F172A;
      --muted: #475569;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --amber: #F59E0B;
      --emerald: #10B981;
      --rose: #E11D48;
      --font-display: 'Jua', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .font-display { font-family: var(--font-display); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Top Bar Contract: 3 zones */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: nowrap;
    }
    .nav-link {
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      padding: 8px 4px;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .nav-link:hover { color: var(--ink); }
    .nav-link.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: #fff; color: var(--ink); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: #F8FAFC; border-color: #CBD5E1; }
    .btn-amber { background: #FEF3C7; color: #92400E; border-color: #FDE68A; }
    .btn-amber:hover:not(:disabled) { background: #FDE68A; }
    .btn-emerald { background: var(--emerald); color: #fff; }
    .btn-emerald:hover:not(:disabled) { background: #059669; }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    .hero-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 3vw, 2.35rem);
      margin: 0 0 6px;
      line-height: 1.2;
    }
    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .segmented {
      display: inline-flex;
      background: #E2E8F0;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 9px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      min-height: 40px;
      white-space: nowrap;
    }
    .seg-btn.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(15,23,42,0.08);
    }

    .stages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .stage-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .stage-card:hover:not(.locked) {
      transform: translateY(-2px);
      border-color: #93C5FD;
    }
    .stage-card.locked {
      opacity: 0.65;
      background: #F8FAFC;
    }

    .arena-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 960px) {
      .arena-layout {
        grid-template-columns: 340px 1fr;
        align-items: start;
      }
    }

    .battle-stage {
      background: linear-gradient(180deg, #EFF6FF 0%, #FFFFFF 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }
    .fighters-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0;
    }
    .hp-bar-bg {
      width: 100%;
      height: 10px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .hp-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .notebook-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 18px;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin: 18px 0;
      min-height: 88px;
      align-items: center;
    }
    .char-slot {
      width: 46px;
      height: 52px;
      border-radius: 10px;
      border: 2px solid #CBD5E1;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.55rem;
      color: var(--ink);
    }
    .char-slot.space-slot {
      width: 24px;
      border-style: dashed;
      border-color: #CBD5E1;
      background: #EFF6FF;
      font-size: 0.75rem;
      color: #64748B;
    }
    .char-slot.filled {
      border-color: var(--primary);
      background: #EFF6FF;
    }
    .char-slot.correct {
      border-color: var(--emerald);
      background: #ECFDF5;
      color: #065F46;
    }
    .char-slot.wrong {
      border-color: var(--rose);
      background: #FFF1F2;
      color: #9F1239;
    }

    .dictation-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.5rem;
      font-family: var(--font-display);
      text-align: center;
      border: 2px solid #CBD5E1;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .dictation-input:focus {
      border-color: var(--primary);
    }

    .tiles-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }
    .tile-btn {
      min-width: 52px;
      height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      border: 2px solid #CBD5E1;
      border-bottom-width: 4px;
      background: #FFFFFF;
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    .tile-btn:hover:not(:disabled) {
      background: #EFF6FF;
      border-color: #93C5FD;
    }
    .tile-btn:active:not(:disabled) {
      transform: translateY(2px);
    }
    .tile-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .feedback-box {
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      border: 1px solid var(--border);
    }
    .feedback-ok {
      background: #ECFDF5;
      border-color: #A7F3D0;
      color: #065F46;
    }
    .feedback-err {
      background: #FFF1F2;
      border-color: #FECDD3;
      color: #9F1239;
    }

    .items-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .stickers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    @keyframes bounceHit {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(0.9) rotate(-5deg); }
    }
    .hit-anim { animation: bounceHit 0.35s ease; }

    @media (max-width: 720px) {
      .header-inner { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
      nav { order: 3; width: 100%; justify-content: space-around; border-top: 1px solid var(--border); padding-top: 6px; }
    }
  </style>
</head>
<body>
  <canvas id="fireworks-canvas" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:40;display:none;"></canvas>
  <header>
    <div class="header-inner">
      <a class="brand" onclick="app.go('MAP')">한글 받아쓰기 모험</a>
      <nav aria-label="주 메뉴">
        <button id="nav-MAP" class="nav-link active" onclick="app.go('MAP')">모험 지도</button>
        <button id="nav-REVIEW" class="nav-link" onclick="app.go('REVIEW')">오답 노트 <span id="review-count" class="num">(0)</span></button>
        <button id="nav-STICKERS" class="nav-link" onclick="app.go('STICKERS')">스티커북 <span id="sticker-count" class="num">(0/12)</span></button>
      </nav>
      <div class="header-actions">
        <button id="mute-btn" class="btn btn-secondary" onclick="app.toggleMute()" style="min-height:40px;padding:6px 12px;">소리 켜짐</button>
      </div>
    </div>
  </header>

  <main id="root"></main>

  <script>
    const STAGES = [
      {
        id: 1, title: '1단계 · 글자 숲', subtitle: '받침이 없는 쉬운 낱말', focus: '기본 자음과 모음',
        monsterName: '먹물 슬라임', monsterColor: '#0EA5E9', rewardCoins: 30,
        questions: [
          { id: '1-1', sentence: '아기 오리', tip: '받침이 없는 글자예요. 띄어쓰기에 주의해요.', distractors: ['우', '어', '라'] },
          { id: '1-2', sentence: '나비 날다', tip: "'나비'와 '날다' 사이를 한 칸 띄어 써요.", distractors: ['너', '바', '고'] },
          { id: '1-3', sentence: '포도 우유', tip: "둥근 입 모양 'ㅗ'와 'ㅜ'를 잘 구별해요.", distractors: ['부', '유', '도'] },
          { id: '1-4', sentence: '바다 파도', tip: "'바'와 '파'의 첫소리 소리를 잘 들어보세요.", distractors: ['마', '타', '고'] },
          { id: '1-5', sentence: '어머니 아버지', tip: '가족을 부르는 소중한 낱말이에요.', distractors: ['오', '누', '하'] },
          { id: '1-6', sentence: '무지개 구름', tip: '보스 문제! 여섯 글자를 차근차근 적어 보아요.', distractors: ['모', '그', '가'], isBoss: true }
        ]
      },
      {
        id: 2, title: '2단계 · 받침 마을', subtitle: '기초 받침 익히기', focus: 'ㄱ, ㄴ, ㄹ, ㅁ, ㅂ, ㅅ, ㅇ',
        monsterName: '지우개 도깨비', monsterColor: '#10B981', rewardCoins: 40,
        questions: [
          { id: '2-1', sentence: '밥을 먹어요.', tip: '문장 끝에 마침표(.)를 꼭 찍어 주세요.', distractors: ['박', '먹', '다'] },
          { id: '2-2', sentence: '손을 씻어요.', tip: "'씻'은 쌍시옷(ㅆ) 아래 시옷(ㅅ) 받침이에요.", distractors: ['실', '신', '아'] },
          { id: '2-3', sentence: '달이 밝아요.', tip: "'밝'에는 겹받침 ㄹㄱ이 들어가요.", distractors: ['박', '발', '아'] },
          { id: '2-4', sentence: '꽃이 피어요.', tip: "'꽃'의 받침은 치읓(ㅊ)이에요.", distractors: ['꼳', '곳', '피'] },
          { id: '2-5', sentence: '학교에 가요.', tip: "'학'의 ㄱ 받침을 잊지 마세요.", distractors: ['하', '교', '오'] },
          { id: '2-6', sentence: '별이 반짝여요.', tip: "보스 문제! '반짝'의 받침과 쌍지읒(ㅉ)을 기억해요.", distractors: ['벌', '작', '어'], isBoss: true }
        ]
      },
      {
        id: 3, title: '3단계 · 소리 다리', subtitle: '소리 나는 대로와 다르게 적기', focus: '연음과 바른 표기',
        monsterName: '엉뚱 박사', monsterColor: '#6366F1', rewardCoins: 50,
        questions: [
          { id: '3-1', sentence: '음악이 좋아요.', tip: "'으마기'라고 들리지만 '음악이'라고 써요.", distractors: ['마', '조', '아'] },
          { id: '3-2', sentence: '동생과 놀아요.', tip: "'노라요'라고 들려도 '놀아요'가 바른 글자예요.", distractors: ['노', '라', '랑'] },
          { id: '3-3', sentence: '우산을 써요.', tip: "'써요'는 쌍시옷(ㅆ)을 사용해요.", distractors: ['서', '산', '를'] },
          { id: '3-4', sentence: '친구가 웃어요.', tip: "'우서요'로 들리지만 받침 ㅅ을 살려 '웃어요'로 써요.", distractors: ['우', '서', '었'] },
          { id: '3-5', sentence: '책을 읽어요.', tip: "'일거요'로 소리 나지만 '읽어요'라고 적어요.", distractors: ['일', '거', '에'] },
          { id: '3-6', sentence: '선생님 안녕하세요.', tip: '보스 문제! 바른 인사말을 정확하게 적어 보아요.', distractors: ['선', '녕', '하'], isBoss: true }
        ]
      },
      {
        id: 4, title: '4단계 · 쌍둥이 언덕', subtitle: '쌍자음과 거센소리', focus: 'ㄲ, ㄸ, ㅃ, ㅆ, ㅉ',
        monsterName: '쌍둥이 유령', monsterColor: '#EC4899', rewardCoins: 60,
        questions: [
          { id: '4-1', sentence: '토끼가 뛰어요.', tip: "'끼'와 '뛰'에 쌍자음이 들어가요.", distractors: ['기', '뒤', '어'] },
          { id: '4-2', sentence: '코끼리 코가 길어요.', tip: "'코끼리'의 둘째 글자는 쌍기역(ㄲ)이에요.", distractors: ['기', '길', '오'] },
          { id: '4-3', sentence: '쓰레기를 주워요.', tip: "'쓰'는 쌍시옷, '주워요'는 ㅜ+ㅓ(ㅝ)예요.", distractors: ['스', '주', '어'] },
          { id: '4-4', sentence: '짜장면이 맛있어요.', tip: "'맛있어요'의 '있'은 ㅆ 받침이에요.", distractors: ['자', '이', '서'] },
          { id: '4-5', sentence: '치타가 빨리 달려요.', tip: "'빨리'는 ㅃ과 ㄹ 받침이 이어져요.", distractors: ['발', '달', '리'] },
          { id: '4-6', sentence: '떡볶이가 정말 매워요.', tip: "보스 문제! '볶'에는 쌍기역(ㄲ) 받침이 들어가요.", distractors: ['덕', '복', '매'], isBoss: true }
        ]
      },
      {
        id: 5, title: '5단계 · 모음 바다', subtitle: '헷갈리는 모음 구별하기', focus: 'ㅐ/ㅔ, ㅘ/ㅝ, ㅢ',
        monsterName: '모음 문어', monsterColor: '#F59E0B', rewardCoins: 70,
        questions: [
          { id: '5-1', sentence: '개미가 지나가요.', tip: "곤충 '개미'는 아이 'ㅐ'를 써요.", distractors: ['게', '메', '지'] },
          { id: '5-2', sentence: '게가 옆으로 걸어요.', tip: "바다에 사는 '게'는 어이 'ㅔ'를 써요.", distractors: ['개', '여', '프'] },
          { id: '5-3', sentence: '과자가 달콤해요.', tip: "'과'는 ㅗ+ㅏ(ㅘ), '해요'는 'ㅐ'예요.", distractors: ['가', '헤', '요'] },
          { id: '5-4', sentence: '의자에 바르게 앉아요.', tip: "'의'는 ㅡ+ㅣ, '앉'은 ㄴㅈ 받침이에요.", distractors: ['이', '안', '자'] },
          { id: '5-5', sentence: '내일이 소풍날이에요.', tip: "'내일'은 'ㅐ', '이에요'는 'ㅔ'예요.", distractors: ['네', '애', '이'] },
          { id: '5-6', sentence: '시계가 똑딱거려요.', tip: "보스 문제! '계'는 ㅖ, '거려요'는 ㅕ예요.", distractors: ['게', '개', '려'], isBoss: true }
        ]
      },
      {
        id: 6, title: '6단계 · 겹받침 성', subtitle: '어려운 겹받침 정복하기', focus: 'ㄺ, ㄻ, ㄼ, ㄵ, ㅄ',
        monsterName: '겹받침 기사', monsterColor: '#8B5CF6', rewardCoins: 80,
        questions: [
          { id: '6-1', sentence: '교실이 넓어요.', tip: "'넓'은 ㄹㅂ 겹받침을 써요.", distractors: ['널', '어', '보'] },
          { id: '6-2', sentence: '하늘이 맑아요.', tip: "'맑'은 ㄹㄱ 겹받침이에요.", distractors: ['말', '막', '가'] },
          { id: '6-3', sentence: '여덟 시에 만나요.', tip: "'덟'은 ㄹㅂ 겹받침을 쓰는 숫자예요.", distractors: ['덜', '덥', '만'] },
          { id: '6-4', sentence: '삶은 달걀을 먹어요.', tip: "'삶'에는 ㄹㅁ 겹받침이 들어가요.", distractors: ['삼', '살', '먹'] },
          { id: '6-5', sentence: '닭이 꼬끼오 울어요.', tip: "'닭'은 ㄹㄱ 겹받침이에요.", distractors: ['닥', '달', '기'] },
          { id: '6-6', sentence: '값이 아주 싸요.', tip: "보스 문제! '값'에는 ㅂㅅ 겹받침이 들어가요.", distractors: ['갑', '갓', '사'], isBoss: true }
        ]
      },
      {
        id: 7, title: '7단계 · 띄어쓰기 공원', subtitle: '문장 부호와 띄어쓰기', focus: '온점(.), 물음표(?), 느낌표(!)',

    const SFX = {
      ctx: null,
      muted: false,
      getCtx() {
        if (this.muted) return null;
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        return this.ctx;
      },
      tone(f, d, type = 'sine', delay = 0, vol = 0.12) {
        const c = this.getCtx();
        if (!c) return;
        const t = c.currentTime + delay;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.02);
      },
      pop() { this.tone(540, 0.07, 'triangle', 0, 0.09); },
      coin() { this.tone(987, 0.09, 'sine', 0, 0.1); this.tone(1318, 0.18, 'sine', 0.07, 0.1); },
      ok() { this.tone(523, 0.11, 'triangle', 0, 0.13); this.tone(659, 0.11, 'triangle', 0.09, 0.13); this.tone(784, 0.22, 'triangle', 0.18, 0.15); },
      combo() { this.tone(587, 0.1, 'triangle', 0, 0.13); this.tone(740, 0.1, 'triangle', 0.08, 0.13); this.tone(880, 0.12, 'triangle', 0.16, 0.14); this.tone(1174, 0.28, 'sine', 0.24, 0.16); },
      wrong() { this.tone(280, 0.16, 'sawtooth', 0, 0.07); this.tone(210, 0.24, 'sawtooth', 0.14, 0.07); },
      win() { [523, 659, 784, 1046].forEach((n, i) => this.tone(n, i === 3 ? 0.42 : 0.13, 'triangle', i * 0.11, 0.15)); },
      firework() {
        const b = 620 + Math.random() * 480;
        this.tone(b, 0.08, 'sine', 0, 0.05);
        this.tone(b * 1.45, 0.12, 'triangle', 0.03, 0.04);
      }
    };

    const Fireworks = {
      animId: 0,
      timers: [],
      stop() {
        if (this.animId) cancelAnimationFrame(this.animId);
        this.animId = 0;
        this.timers.forEach(t => clearTimeout(t));
        this.timers = [];
        const c = document.getElementById('fireworks-canvas');
        if (c) {
          c.style.display = 'none';
          const ctx = c.getContext('2d');
          if (ctx) ctx.clearRect(0, 0, c.width, c.height);
        }
      },
      start() {
        this.stop();
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const c = document.getElementById('fireworks-canvas');
        if (!c) return;
        const ctx = c.getContext('2d');
        if (!ctx) return;
        c.style.display = 'block';

        const palette = ['#F59E0B', '#2563EB', '#10B981', '#EC4899', '#8B5CF6', '#EF4444', '#06B6D4'];
        let w = window.innerWidth, h = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        c.width = Math.floor(w * dpr);
        c.height = Math.floor(h * dpr);
        c.style.width = w + 'px';
        c.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const rockets = [], sparks = [];
        const launch = (xr) => {
          rockets.push({
            x: (xr ?? (0.15 + Math.random() * 0.7)) * w,
            y: h + 10,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -(11 + Math.random() * 4.5),
            targetY: (0.14 + Math.random() * 0.34) * h,
            color: palette[Math.floor(Math.random() * palette.length)],
            trail: []
          });
        };

        const explode = (x, y, col) => {
          SFX.firework();
          const cnt = 44 + Math.floor(Math.random() * 20);
          const col2 = palette[Math.floor(Math.random() * palette.length)];
          for (let i = 0; i < cnt; i++) {
            const ang = (Math.PI * 2 * i) / cnt + (Math.random() - 0.5) * 0.18;
            const spd = 2.2 + Math.random() * 5.8;
            const star = i % 5 === 0;
            sparks.push({
              x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
              color: i % 3 === 0 ? col2 : (i % 4 === 0 ? '#FDE047' : col),
              alpha: 1, decay: 0.011 + Math.random() * 0.01,
              size: star ? 5.5 + Math.random() * 3 : 2.4 + Math.random() * 2.4,
              star, rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.16
            });
          }
        };

        const drawStar = (cx, cy, r, rot) => {
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const rad = i % 2 === 0 ? r : r * 0.45;
            const a = (Math.PI / 5) * i - Math.PI / 2;
            if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
            else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
          }
          ctx.closePath(); ctx.fill(); ctx.restore();
        };

        [40, 160, 320, 750, 900, 1150, 1450, 1950, 2150, 2550, 3050, 3250, 3650].forEach((d, idx) => {
          const xs = [0.25, 0.75, 0.5, 0.2, 0.8, 0.42, 0.62, 0.3, 0.72, 0.5, 0.22, 0.78, 0.48];
          this.timers.push(setTimeout(() => launch(xs[idx]), d));
        });

        const tick = () => {
          ctx.clearRect(0, 0, w, h);
          for (let i = rockets.length - 1; i >= 0; i--) {
            const r = rockets[i];
            r.trail.push({ x: r.x, y: r.y });
            if (r.trail.length > 8) r.trail.shift();
            r.x += r.vx; r.y += r.vy; r.vy += 0.14;
            for (let t = 0; t < r.trail.length; t++) {
              ctx.globalAlpha = ((t + 1) / r.trail.length) * 0.75;
              ctx.fillStyle = r.color;
              ctx.beginPath(); ctx.arc(r.trail[t].x, r.trail[t].y, 2.5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1; ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(r.x, r.y, 3.2, 0, Math.PI * 2); ctx.fill();
            if (r.y <= r.targetY || r.vy >= -1.2) {
              explode(r.x, r.y, r.color);
              rockets.splice(i, 1);
            }
          }
          for (let i = sparks.length - 1; i >= 0; i--) {
            const s = sparks[i];
            s.x += s.vx; s.y += s.vy; s.vx *= 0.965; s.vy = s.vy * 0.965 + 0.085;
            s.alpha -= s.decay; s.rot += s.spin;
            if (s.alpha <= 0.02) { sparks.splice(i, 1); continue; }
            ctx.globalAlpha = Math.max(0, s.alpha); ctx.fillStyle = s.color;
            if (s.star) drawStar(s.x, s.y, s.size, s.rot);
            else { ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); }
          }
          ctx.globalAlpha = 1;
          this.animId = requestAnimationFrame(tick);
        };
        this.animId = requestAnimationFrame(tick);
      }
    };

    function speak(text, rate = 0.88) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[.!?]/g, '').replace(/,/g, ', ');
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'ko-KR';
        u.rate = rate;
        u.pitch = 1.05;
        const ko = window.speechSynthesis.getVoices().find(v => v.lang.toLowerCase().includes('ko'));
        if (ko) u.voice = ko;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    const STORAGE_KEY = 'kr_dictation_g1_save_v1';
    function loadSave() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { coins: 50, stars: {}, stickers: [], wrongIds: [], unlockAll: false, bestCombo: 0 };
    }

    const app = {
      screen: 'MAP',
      inputMode: 'BLOCK', // 'BLOCK' | 'TYPE'
      save: loadSave(),
      session: null,

      persist() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.save)); } catch (e) {}
      },

      go(screen) {
        SFX.pop();
        Fireworks.stop();
        this.screen = screen;
        if (screen !== 'PLAYING' && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        this.render();
      },

      toggleMute() {
        SFX.muted = !SFX.muted;
        document.getElementById('mute-btn').textContent = SFX.muted ? '소리 꺼짐' : '소리 켜짐';
        if (!SFX.muted) SFX.pop();
      },

      setInputMode(mode) {
        SFX.pop();
        this.inputMode = mode;
        this.render();
      },

      toggleUnlockAll() {
        SFX.pop();
        this.save.unlockAll = !this.save.unlockAll;
        this.persist();
        this.render();
      },

      startStage(stageId, isReview = false) {
        SFX.pop();
        Fireworks.stop();
        let questions = [];
        let stageInfo = null;
        if (isReview) {
          const allQ = STAGES.flatMap(s => s.questions);
          questions = allQ.filter(q => this.save.wrongIds.includes(q.id));
          if (!questions.length) return;
          stageInfo = { id: 0, title: '오답 물리치기 복습', monsterName: '실수 도깨비', monsterColor: '#F59E0B', rewardCoins: questions.length * 10 };
        } else {
          stageInfo = STAGES.find(s => s.id === stageId);
          questions = stageInfo.questions;
        }

        this.session = {
          isReview,
          stage: stageInfo,
          questions,
          idx: 0,
          hearts: 3,
          maxHearts: 3,
          combo: 0,
          maxCombo: 0,
          mistakes: 0,
          earnedCoins: 0,
          score: 0,
          answer: '',
          tiles: [],
          usedTileIdxs: [],
          feedback: null, // { ok, expected, actual }
          heroMood: 'idle',
          monsterHit: false,
          showTip: false,
          peekVisible: false,
          peekTimer: null
        };
        this.prepareQuestion();
        this.screen = 'PLAYING';
        this.render();
        setTimeout(() => speak(this.currentQ().sentence, 0.88), 250);
      },

      currentQ() {
        return this.session.questions[this.session.idx];
      },

      prepareQuestion() {
        const q = this.currentQ();
        const chars = Array.from(q.sentence);
        const pool = [...chars, ...(q.distractors || [])];
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        this.session.tiles = pool;
        this.session.usedTileIdxs = [];
        this.session.answer = '';
        this.session.feedback = null;
        this.session.heroMood = 'idle';
        this.session.monsterHit = false;
        this.session.showTip = false;
        this.session.peekVisible = false;
      },

      pickTile(tileIdx) {
        if (this.session.feedback?.ok) return;
        if (this.session.usedTileIdxs.includes(tileIdx)) return;
        SFX.pop();
        this.session.usedTileIdxs.push(tileIdx);
        this.session.answer = this.session.usedTileIdxs.map(i => this.session.tiles[i]).join('');
        this.render();
      },

      backspaceTile() {
        if (!this.session.usedTileIdxs.length || this.session.feedback?.ok) return;
        SFX.pop();
        this.session.usedTileIdxs.pop();
        this.session.answer = this.session.usedTileIdxs.map(i => this.session.tiles[i]).join('');
        this.render();
      },

      clearAnswer() {
        SFX.pop();
        this.session.usedTileIdxs = [];
        this.session.answer = '';
        this.session.feedback = null;
        this.render();
      },

      updateTypedAnswer(val) {
        this.session.answer = val;
      },

      listen(slow = false) {
        SFX.pop();
        speak(this.currentQ().sentence, slow ? 0.62 : 0.88);
      },

      peekSentence() {
        SFX.pop();
        if (this.session.peekTimer) clearTimeout(this.session.peekTimer);
        this.session.peekVisible = true;
        this.render();
        this.session.peekTimer = setTimeout(() => {
          if (this.session) {
            this.session.peekVisible = false;
            this.render();
          }
        }, 2800);
      },

      useItem(type) {
        const s = this.session;
        if (s.feedback?.ok) return;
        if (type === 'SLOW') {
          if (this.save.coins < 5) return;
          this.save.coins -= 5;
          this.persist();
          this.listen(true);
          this.render();
        } else if (type === 'HINT') {
          if (this.save.coins < 10) return;
          const target = this.currentQ().sentence;
          if (s.answer.length >= target.length) return;
          this.save.coins -= 10;
          this.persist();
          SFX.coin();
          const nextChar = Array.from(target)[s.answer.length];
          if (this.inputMode === 'BLOCK') {
            const availIdx = s.tiles.findIndex((t, idx) => t === nextChar && !s.usedTileIdxs.includes(idx));
            if (availIdx !== -1) {
              s.usedTileIdxs.push(availIdx);
              s.answer = s.usedTileIdxs.map(i => s.tiles[i]).join('');
            }
          } else {
            s.answer = s.answer + nextChar;
          }
          this.render();
        } else if (type === 'HEAL') {
          if (this.save.coins < 15 || s.hearts >= s.maxHearts) return;
          this.save.coins -= 15;
          s.hearts += 1;
          this.persist();
          SFX.coin();
          this.render();
        }
      },

      submitAnswer() {
        const s = this.session;
        if (!s || s.feedback?.ok) return;
        const actual = s.answer.trim().replace(/\s+/g, ' ');
        const expected = this.currentQ().sentence;
        if (!actual) return;

        if (actual === expected) {
          s.combo += 1;
          s.maxCombo = Math.max(s.maxCombo, s.combo);
          this.save.bestCombo = Math.max(this.save.bestCombo || 0, s.combo);
          const fever = s.combo >= 3 ? 2 : 1;
          const coinGain = (this.currentQ().isBoss ? 15 : 8) * fever;
          s.earnedCoins += coinGain;
          this.save.coins += coinGain;
          s.score += 100 * fever;
          s.heroMood = 'attack';
          s.monsterHit = true;
          s.feedback = { ok: true, expected, actual };
          if (s.isReview) {
            this.save.wrongIds = this.save.wrongIds.filter(id => id !== this.currentQ().id);
          }
          if (s.combo >= 3) SFX.combo(); else SFX.ok();
          this.checkStickers(false);
          this.persist();
          this.render();
        } else {
          s.combo = 0;
          s.mistakes += 1;
          s.hearts = Math.max(0, s.hearts - 1);
          s.heroMood = 'hurt';
          s.feedback = { ok: false, expected, actual };
          if (!this.save.wrongIds.includes(this.currentQ().id)) {
            this.save.wrongIds.push(this.currentQ().id);
          }
          SFX.wrong();
          this.persist();
          this.render();
        }
      },

      nextQuestion() {
        const s = this.session;
        if (s.hearts <= 0) {
          this.screen = 'RESULT';
          this.render();
          return;
        }
        if (s.idx + 1 >= s.questions.length) {
          this.finishStage();
          return;
        }
        s.idx += 1;
        this.prepareQuestion();
        this.render();
        setTimeout(() => speak(this.currentQ().sentence, 0.88), 220);
      },

      retryCurrent() {
        SFX.pop();
        this.prepareQuestion();
        this.render();
        setTimeout(() => speak(this.currentQ().sentence, 0.88), 180);
      },

      finishStage() {
        const s = this.session;
        const won = s.hearts > 0;
        if (won) {
          SFX.win();
          if (s.isReview) {
            this.unlockSticker('review_hero');
          } else {
            const stars = s.mistakes === 0 ? 3 : s.mistakes <= 2 ? 2 : 1;
            const prev = this.save.stars[s.stage.id] || 0;
            this.save.stars[s.stage.id] = Math.max(prev, stars);
            this.save.coins += s.stage.rewardCoins;
            s.earnedCoins += s.stage.rewardCoins;
          }
          this.checkStickers(true);
          this.persist();
          Fireworks.start();
        }
        this.screen = 'RESULT';
        this.render();
      },

      unlockSticker(id) {
        if (!this.save.stickers.includes(id)) {
          this.save.stickers.push(id);
        }
      },

      checkStickers(stageCleared) {
        const clearedCount = Object.keys(this.save.stars).length;
        const totalStars = Object.values(this.save.stars).reduce((a, b) => a + b, 0);
        if (clearedCount >= 1) this.unlockSticker('first_clear');
        if (Object.values(this.save.stars).some(v => v === 3)) this.unlockSticker('star_3');
        if ((this.save.bestCombo || 0) >= 5) this.unlockSticker('combo_5');
        if (this.save.stars[2]) this.unlockSticker('stage_2');
        if (this.save.stars[4]) this.unlockSticker('stage_4');
        if (this.save.stars[5]) this.unlockSticker('stage_5');
        if (this.save.stars[6]) this.unlockSticker('stage_6');
        if (this.save.stars[8]) this.unlockSticker('stage_8');
        if (totalStars >= 12) this.unlockSticker('stars_12');
        if (totalStars >= 24) this.unlockSticker('stars_24');
        if (this.save.coins >= 200) this.unlockSticker('rich_coins');
      },

      render() {
        document.getElementById('review-count').textContent = `(${this.save.wrongIds.length})`;
        document.getElementById('sticker-count').textContent = `(${this.save.stickers.length}/12)`;
        ['MAP', 'REVIEW', 'STICKERS'].forEach(t => {
          const el = document.getElementById('nav-' + t);
          if (el) el.classList.toggle('active', this.screen === t);
        });

        const root = document.getElementById('root');
        if (this.screen === 'MAP') root.innerHTML = this.viewMap();
        else if (this.screen === 'PLAYING') root.innerHTML = this.viewPlaying();
        else if (this.screen === 'RESULT') root.innerHTML = this.viewResult();
        else if (this.screen === 'STICKERS') root.innerHTML = this.viewStickers();
        else if (this.screen === 'REVIEW') root.innerHTML = this.viewReview();

        if (this.screen === 'PLAYING' && this.inputMode === 'TYPE') {
          const inp = document.getElementById('type-input');
          if (inp && !this.session.feedback) inp.focus();
        }
      },

      viewMap() {
        const totalStars = Object.values(this.save.stars).reduce((a, b) => a + b, 0);
        const cleared = Object.keys(this.save.stars).length;
        const cards = STAGES.map(st => {
          const prevCleared = st.id === 1 || (this.save.stars[st.id - 1] || 0) > 0;
          const unlocked = this.save.unlockAll || prevCleared;
          const stars = this.save.stars[st.id] || 0;
          const starText = '★'.repeat(stars) + '☆'.repeat(3 - stars);
          return `
            <div class="stage-card ${unlocked ? '' : 'locked'}">
              <div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                  <span style="font-size:0.85rem;font-weight:700;color:${st.monsterColor};">${st.focus}</span>
                  <span class="num" style="color:#F59E0B;font-size:1.05rem;letter-spacing:2px;">${starText}</span>
                </div>
                <h3 class="font-display" style="margin:0 0 4px;font-size:1.3rem;">${st.title}</h3>
                <p style="margin:0;color:var(--muted);font-size:0.9rem;">${st.subtitle}</p>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="width:12px;height:12px;border-radius:4px;background:${st.monsterColor};display:inline-block;"></span>
                  <span style="font-size:0.85rem;font-weight:600;color:var(--ink);">${st.monsterName}</span>
                </div>
                <button class="btn ${unlocked ? 'btn-primary' : 'btn-secondary'}" ${unlocked ? '' : 'disabled'} onclick="app.startStage(${st.id})" style="min-height:40px;padding:8px 14px;font-size:0.9rem;">
                  ${unlocked ? '도전하기' : '잠김'}
                </button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="card hero-strip">
            <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
              <div>${heroSvg('happy')}</div>
              <div>
                <h1 class="hero-title">달콩이와 함께하는 1학년 받아쓰기 모험</h1>
                <div class="meta-line">
                  <span>모은 별 <strong class="num" style="color:#D97706;">${totalStars} / 24</strong></span>
                  <span>·</span>
                  <span>별빛 코인 <strong class="num" style="color:#2563EB;">${this.save.coins}개</strong></span>
                  <span>·</span>
                  <span>완료한 단계 <strong class="num">${cleared} / 8</strong></span>
                </div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:0.85rem;font-weight:600;color:var(--muted);">쓰기 방법:</span>
                <div class="segmented">
                  <button class="seg-btn ${this.inputMode === 'BLOCK' ? 'active' : ''}" onclick="app.setInputMode('BLOCK')">글자 블록 맞추기</button>
                  <button class="seg-btn ${this.inputMode === 'TYPE' ? 'active' : ''}" onclick="app.setInputMode('TYPE')">직접 키보드 쓰기</button>
                </div>
              </div>
              <button class="btn btn-secondary" onclick="app.toggleUnlockAll()" style="min-height:38px;padding:6px 12px;font-size:0.85rem;">
                ${this.save.unlockAll ? '단계 순서대로 잠금' : '선생님/부모님용: 전체 단계 열기'}
              </button>
            </div>
          </div>
          <div class="stages-grid">${cards}</div>
        `;
      },

      viewPlaying() {
        const s = this.session;
        const q = this.currentQ();
        const targetChars = Array.from(q.sentence);
        const answerChars = Array.from(s.answer);
        const monsterHp = s.questions.length - s.idx - (s.feedback?.ok ? 1 : 0);
        const monsterPct = Math.round((monsterHp / s.questions.length) * 100);
        const heroPct = Math.round((s.hearts / s.maxHearts) * 100);
        const fever = s.combo >= 3;

        const slotsHtml = targetChars.map((ch, idx) => {
          const isSpace = ch === ' ';
          const typed = answerChars[idx];
          let cls = 'char-slot';
          if (isSpace) cls += ' space-slot';
          if (s.feedback) {
            if (typed === ch) cls += ' correct';
            else cls += ' wrong';
          } else if (typed !== undefined) {
            cls += ' filled';
          }
          const display = isSpace ? (typed === ' ' ? '␣' : '띄') : (typed || '');
          return `<div class="${cls}">${display}</div>`;
        }).join('');

        let inputArea = '';
        if (this.inputMode === 'BLOCK') {
          const tilesHtml = s.tiles.map((t, i) => {
            const used = s.usedTileIdxs.includes(i);
            const label = t === ' ' ? '띄어쓰기' : t;
            return `<button class="tile-btn" ${used || s.feedback?.ok ? 'disabled' : ''} onclick="app.pickTile(${i})">${label}</button>`;
          }).join('');
          inputArea = `
            <div class="tiles-pool">${tilesHtml}</div>
            <div style="display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;">
              <button class="btn btn-secondary" onclick="app.backspaceTile()" ${!s.usedTileIdxs.length || s.feedback?.ok ? 'disabled' : ''}>한 글자 지우기</button>
              <button class="btn btn-secondary" onclick="app.clearAnswer()" ${!s.usedTileIdxs.length || s.feedback?.ok ? 'disabled' : ''}>모두 지우기</button>
              <button class="btn btn-primary" onclick="app.submitAnswer()" ${!s.answer.length || s.feedback?.ok ? 'disabled' : ''}>정답 확인하기</button>
            </div>
          `;
        } else {
          inputArea = `
            <form onsubmit="event.preventDefault(); app.submitAnswer();" style="display:flex;flex-direction:column;gap:12px;align-items:center;">
              <input id="type-input" class="dictation-input" type="text" value="${s.answer.replace(/"/g, '&quot;')}" oninput="app.updateTypedAnswer(this.value)" placeholder="소리를 듣고 여기에 받아쓰세요" ${s.feedback?.ok ? 'readonly' : ''} autocomplete="off" />
              <button type="submit" class="btn btn-primary" ${s.feedback?.ok ? 'disabled' : ''} style="width:100%;max-width:280px;">정답 확인하기 (Enter)</button>
            </form>
          `;
        }

        let feedbackHtml = '';
        if (s.feedback) {
          if (s.feedback.ok) {
            feedbackHtml = `
              <div class="feedback-box feedback-ok">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                  <div>
                    <strong class="font-display" style="font-size:1.25rem;">✓ 참 잘했어요! 완벽한 글자예요!</strong>
                    <div style="font-size:0.9rem;margin-top:4px;">${q.tip}</div>
                  </div>
                  <button class="btn btn-emerald" onclick="app.nextQuestion()">
                    ${s.idx + 1 >= s.questions.length ? '결과 보기' : '다음 문제 →'}
                  </button>
                </div>
              </div>
            `;
          } else {
            feedbackHtml = `
              <div class="feedback-box feedback-err">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                  <div>
                    <strong class="font-display" style="font-size:1.15rem;">✗ 아쉬워요! 바른 글자와 비교해 보아요.</strong>
                    <div style="margin-top:6px;font-size:0.95rem;">바른 정답: <strong style="font-size:1.1rem;color:#0F172A;">${s.feedback.expected}</strong></div>
                    <div style="font-size:0.85rem;margin-top:2px;">${q.tip}</div>
                  </div>
                  <div style="display:flex;gap:8px;">
                    ${s.hearts > 0 ? `<button class="btn btn-secondary" onclick="app.retryCurrent()">다시 써보기</button>` : ''}
                    <button class="btn btn-primary" onclick="app.nextQuestion()">${s.hearts <= 0 ? '결과 보기' : '건너뛰기'}</button>
                  </div>
                </div>
              </div>
            `;
          }
        }

        return `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <button class="btn btn-secondary" onclick="app.go('MAP')" style="min-height:40px;padding:6px 14px;">← 지도로</button>
              <h2 class="font-display" style="margin:0;font-size:1.4rem;">${s.stage.title}</h2>
              ${q.isBoss ? '<span style="font-weight:700;color:#E11D48;">· 최종 보스 문제</span>' : ''}
            </div>
            <div class="meta-line num">
              <span>문제 <strong>${s.idx + 1} / ${s.questions.length}</strong></span>
              <span>·</span>
              <span>코인 <strong>${this.save.coins}개</strong></span>
              <span>·</span>
              <span style="color:${fever ? '#D97706' : 'inherit'};font-weight:700;">콤보 ${s.combo}${fever ? ' (피버 2배!)' : ''}</span>
            </div>
          </div>

          <div class="arena-layout">
            <div class="battle-stage">
              <div style="display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;">
                <span>달콩이 ♥ <span class="num">${s.hearts}/${s.maxHearts}</span></span>
                <span>${s.stage.monsterName} <span class="num">${monsterHp}/${s.questions.length}</span></span>
              </div>
              <div class="fighters-row">
                <div style="text-align:center;flex:1;">
                  ${heroSvg(s.heroMood)}
                  <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${heroPct}%;background:#10B981;"></div></div>
                </div>
                <div class="font-display" style="font-size:1.3rem;color:var(--muted);">VS</div>
                <div style="text-align:center;flex:1;">
                  ${monsterSvg(s.stage.id || 1, s.stage.monsterColor, s.monsterHit)}
                  <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${monsterPct}%;background:${s.stage.monsterColor};"></div></div>
                </div>
              </div>
              <div style="font-size:0.88rem;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;">
                <strong>선생님 힌트</strong><br/>
                ${s.showTip ? q.tip : '도움이 필요하면 오른쪽 아래 힌트 버튼을 눌러보세요!'}
              </div>
            </div>

            <div class="card">
              <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                  <button class="btn btn-primary" onclick="app.listen(false)">문제 소리 듣기</button>
                  <button class="btn btn-secondary" onclick="app.listen(true)">천천히 듣기</button>
                  <button class="btn btn-amber" onclick="app.peekSentence()">3초 눈으로 보기</button>
                </div>
                <button class="btn btn-secondary" onclick="app.session.showTip = !app.session.showTip; app.render();" style="min-height:40px;padding:6px 12px;font-size:0.85rem;">
                  ${s.showTip ? '힌트 숨기기' : '선생님 힌트 보기'}
                </button>
              </div>

              ${s.peekVisible ? `<div style="margin-top:14px;padding:14px;border-radius:12px;background:#FEF3C7;border:1px solid #FDE68A;text-align:center;font-family:var(--font-display);font-size:1.6rem;color:#92400E;">잠깐 보기: ${q.sentence}</div>` : ''}

              <div class="notebook-slots" aria-label="받아쓰기 글자 칸">${slotsHtml}</div>

              ${inputArea}
              ${feedbackHtml}

              <div class="items-bar">
                <span style="font-size:0.85rem;font-weight:700;color:var(--muted);align-self:center;">아이템 상점:</span>
                <button class="btn btn-secondary" style="min-height:38px;padding:6px 12px;font-size:0.85rem;" onclick="app.useItem('HINT')" ${this.save.coins < 10 || s.feedback?.ok ? 'disabled' : ''}>첫 글자 돋보기 (10코인)</button>
                <button class="btn btn-secondary" style="min-height:38px;padding:6px 12px;font-size:0.85rem;" onclick="app.useItem('HEAL')" ${this.save.coins < 15 || s.hearts >= s.maxHearts ? 'disabled' : ''}>딸기우유 하트+1 (15코인)</button>
              </div>
            </div>
          </div>
        `;
      },

      viewResult() {
        const s = this.session;
        const won = s.hearts > 0;
        const stars = !won ? 0 : (s.mistakes === 0 ? 3 : s.mistakes <= 2 ? 2 : 1);
        return `
          <div class="card" style="max-width:600px;margin:24px auto;text-align:center;">
            <div style="margin-bottom:12px;">${heroSvg(won ? 'happy' : 'hurt')}</div>
            <h2 class="font-display" style="font-size:2rem;margin:0 0 8px;">${won ? `${s.stage.title} 완료!` : '아쉬워요! 다시 도전해 볼까요?'}</h2>
            ${won ? `<div class="num" style="font-size:2.4rem;color:#F59E0B;letter-spacing:6px;margin:10px 0;">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>` : ''}
            <p style="color:var(--muted);margin:0 0 20px;">
              ${won ? `${s.stage.monsterName}를 물리치고 코인 ${s.earnedCoins}개를 얻었어요!` : '하트가 모두 닳았어요. 오답 노트나 다시 도전으로 연습해 보아요.'}
            </p>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;background:#F8FAFC;padding:16px;border-radius:14px;border:1px solid var(--border);">
              <div><div style="font-size:0.8rem;color:var(--muted);">점수</div><strong class="num" style="font-size:1.3rem;">${s.score}</strong></div>
              <div><div style="font-size:0.8rem;color:var(--muted);">최대 콤보</div><strong class="num" style="font-size:1.3rem;">${s.maxCombo}</strong></div>
              <div><div style="font-size:0.8rem;color:var(--muted);">틀린 횟수</div><strong class="num" style="font-size:1.3rem;">${s.mistakes}</strong></div>
            </div>
            <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
              ${won ? `<button class="btn btn-amber" onclick="SFX.pop(); Fireworks.start();">폭죽 다시 터뜨리기</button>` : ''}
              <button class="btn btn-secondary" onclick="app.startStage(${s.stage.id}, ${s.isReview})">다시 도전</button>
              <button class="btn btn-primary" onclick="app.go('MAP')">모험 지도로 돌아가기</button>
            </div>
          </div>
        `;
      },

      viewStickers() {
        const cards = STICKERS.map(st => {
          const unlocked = this.save.stickers.includes(st.id);
          return `
            <div class="card" style="opacity:${unlocked ? 1 : 0.6};background:${unlocked ? '#fff' : '#F8FAFC'};">
              <div style="display:flex;align-items:center;gap:14px;">
                <div style="width:52px;height:52px;border-radius:14px;background:${unlocked ? st.color : '#CBD5E1'};color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.5rem;flex-shrink:0;">
                  ${unlocked ? '★' : '?'}
                </div>
                <div>
                  <h3 class="font-display" style="margin:0 0 4px;font-size:1.15rem;">${st.name}</h3>
                  <p style="margin:0;font-size:0.85rem;color:var(--muted);">${unlocked ? st.desc : '조건: ' + st.cond}</p>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return `
          <div style="margin-bottom:20px;">
            <h1 class="hero-title">칭찬 스티커 도감 (${this.save.stickers.length} / 12)</h1>
            <p style="margin:0;color:var(--muted);">받아쓰기 모험을 하면서 멋진 칭찬 스티커를 모두 모아 보아요.</p>
          </div>
          <div class="stickers-grid">${cards}</div>
        `;
      },

      viewReview() {
        const allQ = STAGES.flatMap(s => s.questions);
        const list = allQ.filter(q => this.save.wrongIds.includes(q.id));
        if (!list.length) {
          return `
            <div class="card" style="text-align:center;padding:48px 24px;">
              <h2 class="font-display" style="font-size:1.7rem;margin:0 0 8px;">오답 노트가 깨끗해요!</h2>
              <p style="color:var(--muted);margin:0 0 20px;">아직 틀린 문제가 없거나, 모든 오답을 완벽하게 복습했어요.</p>
              <button class="btn btn-primary" onclick="app.go('MAP')">모험 지도로 가기</button>
            </div>
          `;
        }
        return `
          <div class="card" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
            <div>
              <h1 class="hero-title" style="margin-bottom:4px;">오답 노트 (${list.length}문제)</h1>
              <p style="margin:0;color:var(--muted);">틀렸던 문장을 다시 맞히면 오답 노트에서 지워지고 보너스 코인을 받아요!</p>
            </div>
            <button class="btn btn-primary" onclick="app.startStage(0, true)">오답 물리치기 시작</button>
          </div>
          <div style="display:grid;gap:12px;">
            ${list.map(q => `
              <div class="card" style="padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                <div>
                  <strong class="font-display" style="font-size:1.25rem;">${q.sentence}</strong>
                  <div style="font-size:0.88rem;color:var(--muted);margin-top:2px;">${q.tip}</div>
                </div>
                <button class="btn btn-secondary" onclick="speak('${q.sentence.replace(/'/g, "\\'")}', 0.82)">들어보기</button>
              </div>
            `).join('')}
          </div>
        `;
      }
    };

    app.render();
  </script>
</body>
</html>
